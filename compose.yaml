services:
  eclaim-mcp:
    build: .
    restart: unless-stopped
    environment:
      ECLAIM_API_BASE_URL: "${ECLAIM_API_BASE_URL:?Set ECLAIM_API_BASE_URL in .env}"
      ECLAIM_API_CLIENT_ID: "${ECLAIM_API_CLIENT_ID:?Set ECLAIM_API_CLIENT_ID in .env}"
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env}"
      ECLAIM_API_TIMEOUT: "${ECLAIM_API_TIMEOUT:-10s}"
    ports:
      - "127.0.0.1:${ECLAIM_MCP_HOST_PORT:-8091}:8091"